<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Secure Event Deposit | Instapic</title><meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .deposit-page{max-width:720px;text-align:center}.deposit-box{margin:16px auto 0;padding:20px;border-radius:18px;background:rgba(255,255,255,.055);text-align:center}
    .deposit-total{display:flex;justify-content:center;gap:16px;font-size:1.15rem;margin:12px 0 20px}
    #card-container,#google-pay-button,.apple-pay-wrap{margin:14px 0}
    .apple-pay-button{-webkit-appearance:-apple-pay-button;-apple-pay-button-type:pay;-apple-pay-button-style:white;width:100%;height:48px;border:0;border-radius:12px;cursor:pointer}
    .pay-divider{text-align:center;opacity:.75;margin:18px 0}
    .wallet-status{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.07);font-size:.9rem}
    #card-container,#google-pay-button,.apple-pay-wrap,#card-button{width:100%;max-width:430px;margin-left:auto;margin-right:auto}
    .booking-confirmation{max-width:560px;margin:20px auto;padding:24px;border-radius:18px;background:rgba(122,255,183,.1);border:1px solid rgba(122,255,183,.5)}
    .booking-pin{font-size:1.55rem;margin:14px 0}.booking-confirmation .btn{display:inline-block;margin-top:12px}
  </style>
</head>
<body class="page">
  <main class="card deposit-page">
    <header class="page-intro"><p class="eyebrow">Instapic event hire</p><h1>Secure booking deposit</h1></header>
    <div id="deposit-status">Loading secure payment…</div>
    <section id="deposit-content" class="deposit-box" hidden>
      <h2 id="event-name"></h2>
      <div class="deposit-total"><span>Deposit due now</span><strong id="deposit-total"></strong></div>
      <div id="google-pay-button"></div>
      <div class="apple-pay-wrap"><button id="apple-pay-button" type="button" hidden style="display:none"></button></div>
      <div id="apple-pay-status" class="wallet-status" hidden></div>
      <div class="pay-divider">or pay by card</div>
      <div id="card-container"></div>
      <button class="btn" id="card-button">Pay deposit securely</button>
      <p><small>Payments are processed securely by Square. Your event is booked only after payment is approved.</small></p>
    </section>
  </main>
  <footer class="site-footer"><small>Instapic by Little Trends — Moments Made Magical ✨</small></footer>
  <script src="https://web.squarecdn.com/v1/square.js"></script>
  <script src="site_core.js?v=20260728-booked-portal"></script>
  <script src="event_deposit_runtime.js?v=20260728-booked-portal"></script>
<script defer src="site_analytics.js?v=20260805-mpc-exclusion"></script></body>
</html>
