<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Penny Fever · Ride</title>
<link rel="stylesheet" href="style.css">
<style>
  body{background:#1a1510;color:#f3e6c8;margin:0;font-family:Georgia,serif}
  #hud{position:fixed;left:0;right:0;top:0;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;z-index:2}
  #hud a{pointer-events:auto;color:#f3dfb2}
  #stage{display:block;margin:0 auto;max-width:100vw;max-height:100vh}
  #readout{position:fixed;left:0;right:0;bottom:0;padding:14px 16px 22px;text-align:center;background:linear-gradient(transparent,#1a1510ee);z-index:2}
  #board{position:fixed;inset:0;display:grid;place-items:center;background:#1a1510f2;z-index:3}
  #board.hidden{display:none}
  #board button{font:inherit;padding:.7rem 1.2rem;border-radius:999px;border:1px solid #c9ae7b;background:#3a2c1c;color:#f3e6c8;cursor:pointer}
</style>
</head>
<body>
<div id="hud"><a href="./" id="back">← midway</a><span id="title">Ride</span><span id="fare">1¢ trip</span></div>
<canvas id="stage" width="900" height="1200"></canvas>
<div id="readout">Boarding…</div>
<div id="board"><div style="text-align:center;max-width:28rem;padding:1.5rem">
  <h1 id="board-title" style="font-weight:400;margin:0 0 .5rem">Ride</h1>
  <p id="board-intro" style="opacity:.9"></p>
  <p style="font-size:.9rem;opacity:.75">Full trip · other guests riding · no hop-off stamps</p>
  <p style="margin-top:1.2rem"><button type="button" id="go">Board · 1¢</button></p>
</div></div>
<script type="module">
const params = new URLSearchParams(location.search);
const id = params.get('ride') || 'horse-carousel';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const readout = document.getElementById('readout');
const board = document.getElementById('board');

const mod = await import('./rides/' + id + '.js?v=' + Date.now());
const ride = mod.default;
document.getElementById('title').textContent = ride.title;
document.getElementById('board-title').textContent = ride.title;
document.getElementById('board-intro').textContent = ride.intro || '';
document.title = 'Penny Fever · ' + ride.title;

let state = null;
let last = performance.now();

function start() {
  board.classList.add('hidden');
  state = ride.create();
  state.phase = state.phase || 'riding';
  last = performance.now();
  loop();
}
document.getElementById('go').onclick = start;

function loop(now = performance.now()) {
  if (!state) return;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  ride.update?.(state, dt);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ride.draw(state, {
    ctx, w: canvas.width, h: canvas.height,
    clear: () => ctx.clearRect(0, 0, canvas.width, canvas.height),
  });
  readout.textContent = ride.readout?.(state) || state.note || '';
  if (state.phase !== 'done') requestAnimationFrame(loop);
  else {
    readout.textContent = (state.note || 'Trip over.') + ' · tap Board again from the card';
    setTimeout(() => { board.classList.remove('hidden'); state = null; }, 1600);
  }
}

canvas.addEventListener('pointerdown', e => {
  if (!state || !ride.pointer) return;
  const r = canvas.getBoundingClientRect();
  ride.pointer(state, 'down', {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height),
  });
});
</script>
</body>
</html>
