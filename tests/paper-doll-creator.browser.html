<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../penny-fever/">
<link rel="stylesheet" href="world/crew-selector.css">
<div id="discoveryDoor"><div class="door-crew"></div></div>
<pre id="testResult">RUNNING</pre>
<script type="module">
import {composeDollCanvas,blankDraft,keepMine,getMine} from './world/paper-dolls.js?v=doll-folders-6';
import './world/crew-selector.js?v=doll-folders-6';
const assert=(ok,message)=>{if(!ok)throw new Error(message);};
let waitStep=0;
const waitFor=async fn=>{waitStep++;for(let i=0;i<300;i++){if(fn())return;await new Promise(r=>setTimeout(r,50));}throw new Error('Timed out waiting for preview step '+waitStep);};
try {
  await waitFor(()=>globalThis.PennyFeverDoll);
  performance.clearResourceTimings();
  globalThis.PennyFeverDoll.open();
  const book=document.querySelector('.crew-book');
  const details=book.querySelector('.crew-collections');
  details.open=true; details.scrollIntoView();
  const preview=document.getElementById('dollPreviewCanvas');
  const visible=()=>preview.getContext('2d').getImageData(0,0,384,512).data.some((v,i)=>i%4===3&&v>200);
  await waitFor(()=>visible());
  assert(book.querySelectorAll('img[data-doll-src]').length>0,'Offscreen thumbnails were all requested on open');
  const tray=book.querySelector('.doll-tray'); tray.scrollIntoView();
  const sections=[...tray.querySelectorAll('.doll-item-section')];
  assert(sections.length===8 && sections.every(section=>!section.open),'Item sections should start collapsed');
  sections[0].querySelector('summary').click();
  assert(sections[0].open,'Hair section did not expand');
  await waitFor(()=>book.querySelector('.doll-piece-thumb img[src]'));
  const first=book.querySelector('.doll-piece-thumb img[src]');
  await waitFor(()=>first.complete && first.naturalWidth>0);
  const requests=performance.getEntriesByType('resource').map(r=>r.name);
  assert(!requests.some(url=>/paper-dolls\/(hair-clean|hats-clean|outfits)\//.test(url)),'Thumbnail tray downloaded full-size layers');
  const thumbs=book.querySelectorAll('.doll-piece-thumb img[src]');
  assert([...thumbs].every(img=>img.src.includes('/thumbnails/')&&img.naturalWidth<=384),'Oversized thumbnail');
  // Rapid wheel changes must settle on the last choice, without an older render winning.
  const wheel=document.getElementById('skinWheel');
  for(const value of ['#ae7251','#a96942','#be8860']){wheel.value=value;wheel.dispatchEvent(new Event('input',{bubbles:true}));}
  const expected=await composeDollCanvas({...blankDraft(),skin:'custom',skinHex:'#be8860'});
  const crop=document.createElement('canvas');crop.width=384;crop.height=512;
  crop.getContext('2d').drawImage(expected,0,0,384,512,0,0,384,512);
  await waitFor(()=>preview.toDataURL()===crop.toDataURL());
  for(let view=0;view<4;view++) {
    assert(visible(), 'A rotated preview is blank');
    document.getElementById('dollRotate').click();
  }
  // A delayed/failed selected layer must not clear the last visible preview.
  const previous=preview.toDataURL();
  const NativeImage=window.Image;
  const imageSrc=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');
  window.Image=function(){const img=new NativeImage();Object.defineProperty(img,'src',{
    get(){return imageSrc.get.call(img);},set(url){
      if(String(url).includes('/hair-clean/bun.png')) setTimeout(()=>img.dispatchEvent(new Event('error')),300);
      else imageSrc.set.call(img,url);
    }});return img;};
  book.querySelector('[data-doll-key="hair"][data-doll-val="bun"]').click();
  await waitFor(()=>document.getElementById('dollPreview').getAttribute('aria-busy')==='true');
  assert(preview.toDataURL()===previous,'Starting an edit cleared the preview');
  await waitFor(()=>document.getElementById('dollRenderStatus').textContent.includes('Couldn’t load'));
  assert(preview.toDataURL()===previous,'A failed edit cleared the preview');
  window.Image=NativeImage;
  book.querySelector('[data-doll-key="hair"][data-doll-val="bun"]').click();
  await waitFor(()=>document.getElementById('dollRenderStatus').textContent==='');
  assert(visible(),'Retry left a blank preview');
  const choose=(key,val)=>book.querySelector(`[data-doll-key="${key}"][data-doll-val="${val}"]`).click();
  choose('top','seaside');choose('bottom','picnic');choose('addon','library');choose('footwear','seaside');
  await waitFor(()=>document.getElementById('dollRenderStatus').textContent==='');
  assert(__pfDoll.draft.top==='seaside' && __pfDoll.draft.bottom==='picnic' && __pfDoll.draft.addon==='library','Separate clothing choices replaced one another');
  choose('outfit','garden');
  assert(__pfDoll.draft.top==='none' && __pfDoll.draft.bottom==='none' && __pfDoll.draft.addon==='library','Dress did not replace separates or discarded cardigan');
  await waitFor(()=>document.getElementById('dollRenderStatus').textContent==='');
  const dressed=await composeDollCanvas({...blankDraft(),outfit:'garden'});
  const layered=await composeDollCanvas({...blankDraft(),outfit:'garden',addon:'library'});
  const lower=c=>c.getContext('2d').getImageData(0,320,1536,192).data;
  const beforeLower=lower(dressed),afterLower=lower(layered);
  assert(beforeLower.every((v,i)=>v===afterLower[i]),'Cardigan replaced the lower outfit');
  keepMine(__pfDoll.draft);
  assert(getMine().addon==='library' && getMine().footwear==='seaside','Clothing choices did not survive saving');
  assert(visible(),'Clothing edits blanked the preview');
  sections[0].querySelector('summary').click();
  assert(!sections[0].open && visible(),'Collapsing items changed the doll');
  book.close();
  document.getElementById('testResult').textContent='PASS: preview stays visible through edits, four rotations, delayed failure and retry; thumbnails deferred; latest colour wins; separate clothing and cardigan save correctly';
  document.documentElement.dataset.result='pass';
} catch(e){document.getElementById('testResult').textContent='FAIL: '+e.message;document.documentElement.dataset.result='fail';}
</script>
